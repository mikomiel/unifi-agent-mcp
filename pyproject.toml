[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "unifi-agent-mcp"
version = "0.0.0"
description = "Read-only UniFi Network inspection and optional operator-approved firewall management"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=44", "fastmcp>=4,<5", "pydantic>=2,<3"]

[project.scripts]
unifi-agent-mcp = "unifi_agent_mcp.server:main"
unifi-firewall-executor = "unifi_agent_mcp.executor:main"

[project.urls]
Homepage = "https://github.com/mikomiel/unifi-agent-mcp"
Issues = "https://github.com/mikomiel/unifi-agent-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
